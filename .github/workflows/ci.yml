name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ORACLE_JDK: "25.0.5"

jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: oracle
          java-version: ${{ env.ORACLE_JDK }}
          cache: maven
      - name: Build, format check, unit and integration tests
        run: sh ./mvnw -B -ntp verify
