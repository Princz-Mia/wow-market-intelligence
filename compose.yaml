# Warehouse and collector. Copy .env.example to .env and fill it in first.
# Every published port binds to localhost; the collector publishes none.
name: wow-market-intelligence

x-logging: &logging
  # Bounded logs: the stack runs unattended for weeks on a small VM.
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      COLLECTOR_DB_PASSWORD: ${COLLECTOR_DB_PASSWORD:?set it in .env}
      TRANSFORMER_DB_PASSWORD: ${TRANSFORMER_DB_PASSWORD:?set it in .env}
      BI_READER_DB_PASSWORD: ${BI_READER_DB_PASSWORD:?set it in .env}
    volumes:
      # PostgreSQL 18 images keep data in a versioned subdirectory of this path.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432
    healthcheck:
      # TCP on purpose: the temporary init server listens only on the Unix socket.
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d wow_market]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COLLECTOR_DB_URL: jdbc:postgresql://postgres:5432/wow_market
      COLLECTOR_DB_PASSWORD: ${COLLECTOR_DB_PASSWORD:?set it in .env}
      BLIZZARD_CLIENT_ID: ${BLIZZARD_CLIENT_ID:?set it in .env}
      BLIZZARD_CLIENT_SECRET: ${BLIZZARD_CLIENT_SECRET:?set it in .env}
      # Set to false to run the stack without collecting, e.g. on a laptop next to the always-on host.
      COLLECTOR_CAPTURE_ENABLED: ${COLLECTOR_CAPTURE_ENABLED:-true}
    volumes:
      - archive-data:/data/archive
    mem_limit: 1g
    logging: *logging

volumes:
  postgres-data:
  archive-data:
